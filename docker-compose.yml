services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wareflow-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "WareFlow2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'WareFlow2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - wareflow-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wareflow-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=WareFlowDB;User Id=sa;Password=WareFlow2026!;TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "WareFlowDockerSecretKey2026MustBe32CharsOrMoreForHS256"
      Jwt__Issuer: "WareFlowAPI"
      Jwt__Audience: "WareFlowClient"
      Jwt__ExpireDays: "7"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/Health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - wareflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "/api"
    container_name: wareflow-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wareflow-net

volumes:
  sqlserver-data:

networks:
  wareflow-net:
    driver: bridge
